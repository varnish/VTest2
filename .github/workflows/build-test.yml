name: build-and-test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libpcre2-dev \
            libssl-dev \
            python3 \
            nghttp2-client

      - name: Build vtest
        run: make vtest

      - name: Run test suite
        run: make test
